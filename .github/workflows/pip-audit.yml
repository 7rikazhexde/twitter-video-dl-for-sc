name: Dependency Vulnerability Scan

# Scans resolved dependencies (incl. transitive, e.g. certifi) against the
# PyPI Advisory Database with pip-audit. Runs on dependency-file changes AND
# on a weekly schedule, since a new CVE (like the eMudhra emSign CA incident)
# can land against an already-pinned version with no code change at all.

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pip-audit.yml'
  # No path filter here: pip-audit is a required branch-protection check, so
  # it must report a status on every PR, including ones that don't touch
  # pyproject.toml/uv.lock (e.g. workflow-only changes) - otherwise GitHub
  # treats the required check as "never reported" and blocks the merge
  # indefinitely rather than as skipped/passing.
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1' # Weekly, Monday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Export resolved dependencies
        run: uv export --format requirements-txt --no-emit-project --all-extras -o audit-requirements.txt

      - name: Run pip-audit
        run: uvx pip-audit -r audit-requirements.txt
