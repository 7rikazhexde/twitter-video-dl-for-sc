name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'ci/**'
      - 'twitter-video-dl-for-sc.py'
      - 'twitter-video-dl.py'
      - 'twitter-video-dl-server.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'ci/**'
      - 'twitter-video-dl-for-sc.py'
      - 'twitter-video-dl.py'
      - 'twitter-video-dl-server.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff check
        run: uv run ruff check twitter-video-dl-for-sc.py twitter-video-dl.py src tests ci

      - name: Ruff format check
        run: uv run ruff format --check twitter-video-dl-for-sc.py twitter-video-dl.py src tests ci

  test:
    runs-on: ubuntu-latest
    strategy:
      # Run every Python version even if one fails, so the full matrix status is visible.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # NOTE: these tests call the live Syndication/GraphQL APIs on x.com.
      # A failure here can mean a real regression, or it can mean X changed a
      # page/response shape, or rate-limited/blocked the runner's IP range -
      # see "Known Limitations" in CLAUDE.md. Check the failure output before
      # assuming the code change is at fault.
      - name: Run tests
        run: uv run pytest tests/
