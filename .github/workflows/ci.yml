name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'ci/**'
      - 'twitter-video-dl-for-sc.py'
      - 'twitter-video-dl.py'
      - 'twitter-video-dl-server.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'ci/**'
      - 'twitter-video-dl-for-sc.py'
      - 'twitter-video-dl.py'
      - 'twitter-video-dl-server.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff check
        run: uv run ruff check twitter-video-dl-for-sc.py twitter-video-dl.py src tests ci

      - name: Ruff format check
        run: uv run ruff format --check twitter-video-dl-for-sc.py twitter-video-dl.py src tests ci

  # Syndication API is the primary, reliable download path - required to pass.
  test-syndication:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run Syndication API tests
        run: >
          uv run pytest tests/test_syndication_api.py
          tests/test_comprehensive_comparison.py::test_syndication_api_with_all_toml_cases

  # GraphQL is the fallback path. It calls x.com directly (not just the
  # syndication CDN) to scrape a bearer token from main.js, which is far more
  # sensitive to X changing its page markup - see "Known Limitations" in
  # CLAUDE.md. This job is deliberately NOT in main's required status checks
  # (branch protection), so an unrelated X-side change doesn't stop every PR
  # from merging - but it still reports its real pass/fail here rather than
  # being masked with continue-on-error, and fail-fast stops the other Python
  # versions as soon as one fails instead of burning CI minutes on a result
  # we already know (continue-on-error would otherwise suppress fail-fast).
  test-graphql-fallback:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run GraphQL API tests
        run: >
          uv run pytest tests/test_graphql_api.py
          tests/test_comprehensive_comparison.py::test_graphql_api_with_all_toml_cases
